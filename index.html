<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page-specific title, description, social and structured data (filled in at build time). -->
    <!--seo--><!--/seo-->

    <meta name="application-name" content="PDF Editor" />
    <meta name="apple-mobile-web-app-title" content="PDF Editor" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f8f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved (or system) theme before first paint, so there is no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pdf-editor:theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        PDF Editor runs entirely in your browser: edit PDF text, merge, split, organize, compress, resize, and add or remove
        watermarks, with unlimited edits on files of any size and nothing uploaded. Please enable JavaScript to use it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
